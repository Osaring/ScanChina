# Télécharge la base Open Food Facts, garde les produits utiles en Chine
# et met à jour data.json. Tourne automatiquement chaque lundi,
# et peut être relancé à la main (onglet Actions > Mise à jour des produits > Run workflow).
name: Mise à jour des produits

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * 1"
  push:
    paths:
      - scripts/build_data.py
      - .github/workflows/update-data.yml

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Télécharger et filtrer Open Food Facts
        run: |
          set -o pipefail
          curl -fsSL --retry 3 --retry-delay 20 \
            https://static.openfoodfacts.org/data/en.openfoodfacts.org.products.csv.gz \
            | python3 scripts/build_data.py > data.new.json
          python3 -c "import json; d=json.load(open('data.new.json')); assert d['count'] > 1000, d['count']; print(d['count'], 'produits dont', d['cn'], 'chinois')"
          mv data.new.json data.json

      - name: Publier si la base a changé
        run: |
          git config user.name "scanchina-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --cached --quiet; then
            echo "Aucun changement"
          else
            git commit -m "Mise à jour de la base produits"
            git pull --rebase
            git push
          fi
